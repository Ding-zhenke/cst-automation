name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -o addopts='' -m "not gui" -q

  mcp-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,mcp]"
      - run: python -m pytest cst_mcp/tests -o addopts='' -m "not gui" -q

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install ".[dev]"
      - run: python -m build --wheel --sdist
      - name: Verify installed wheel in an independent environment
        shell: pwsh
        run: |
          python -m venv work/wheel-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          & work/wheel-smoke/Scripts/python.exe -m pip install "$($wheel.FullName)[mcp]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokeScript = (Resolve-Path scripts/verify_wheel.py).Path
          $smokePython = (Resolve-Path work/wheel-smoke/Scripts/python.exe).Path
          $env:PYTHONPATH = ''
          $env:PYTHONDONTWRITEBYTECODE = '1'
          New-Item -ItemType Directory -Force work/wheel-smoke/run | Out-Null
          Push-Location work/wheel-smoke/run
          try {
            & $smokePython -B $smokeScript
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
